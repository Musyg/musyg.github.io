name: Quality

on:
  pull_request:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm install --global npm@11.6.0
      - run: npm ci
      - run: npm exec -- playwright install --with-deps chromium
      - run: npm run verify
      - name: Save resilience demo preview screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: resilience-preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/**/resilience-*.png
          if-no-files-found: ignore
          retention-days: 3
