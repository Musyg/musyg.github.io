name: Quality

on:
  workflow_dispatch:
  pull_request:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MEMORY_HIERARCHY_SCREENSHOT_DIR: ${{ runner.temp }}/memory-hierarchy
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm install --global npm@11.6.0
      - run: npm ci
      - run: npm exec -- playwright install --with-deps chromium
      - run: npm run verify
      - name: Save Persistent Memory hierarchy previews
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: memory-hierarchy-${{ github.sha }}
          path: ${{ runner.temp }}/memory-hierarchy/*.png
          if-no-files-found: ignore
          retention-days: 3
      - name: Save validated Hostinger release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hostinger-release-${{ github.sha }}
          path: release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
      - name: Capture resilience demo preview after accessibility tests
        run: npm exec -- playwright test tests/e2e/resilience-demo.spec.ts --grep 'resilience (circuit|dlq|mqtt) fr at (1440|390)px$'
      - name: Save resilience demo preview screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: resilience-preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/**/resilience-*.png
          if-no-files-found: ignore
          retention-days: 3
