version: 2
updates:
  - package-ecosystem: npm
    directory: /
    ignore:
      # Keep Node types aligned with the Node 24 build runtime.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
