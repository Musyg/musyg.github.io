.step{font:12px ui-monospace,monospace;color:var(--muted)}

.observation{min-height:112px}
.observation p{color:var(--muted);max-width:760px}

.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
.primary{background:rgba(0,94,255,.75);border-color:var(--blue)}

.details{display:grid;grid-template-columns:1fr 1fr;gap:32px;margin-top:36px}
.details h2{font-size:17px}
.details p{font-size:14px;color:var(--muted)}

.command{border:1px solid var(--line);padding:14px;border-radius:8px;background:#000;white-space:pre-wrap}

details{margin-top:28px;border-top:1px solid var(--line);padding-top:18px}
summary{cursor:pointer;color:var(--muted)}
.table-scroll{overflow-x:auto;margin-top:16px}
table{border-collapse:collapse;width:100%;font:12px/1.8 ui-monospace,monospace;text-align:left;white-space:nowrap}
td,th{border-bottom:1px solid var(--line);padding:8px}
th{color:var(--muted);font-weight:400}
tr.current{background:rgba(0,94,255,.13)}
footer{margin-top:28px;font-size:12px;color:var(--muted)}

.status-line{margin-bottom:26px}.status{font:13px ui-monospace,monospace}.main-grid,.outcome,.evidence{min-width:0}.answer{margin-top:20px}.answer[data-empty="true"]{border-left-style:dashed}#answer{font-size:18px;line-height:1.45;overflow-wrap:anywhere}#answer-meta{font:12px/1.8 ui-monospace,monospace;color:var(--muted);margin-top:10px;overflow-wrap:anywhere}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.15em;color:var(--muted);margin:0 0 14px}.evidence{margin-top:24px}.evidence-top .label{margin:0}.evidence-card{overflow-wrap:anywhere}.card-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;margin-bottom:8px}.card-head strong{font-size:14px}.card-head span{color:var(--muted);font:12px ui-monospace,monospace}.evidence-card p{font-size:14px;margin:0}.ref{display:block;color:var(--muted);font:12px/1.8 ui-monospace,monospace;margin-top:10px}.control-group{display:flex;gap:10px;flex-wrap:wrap}.technical .tech-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:18px}.tech-grid p,.technical>p{font-size:14px;color:var(--muted)}pre{max-height:300px;overflow:auto;margin:0;padding:14px;border:1px solid var(--line);border-radius:8px;font:12px/1.8 ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere}.links{display:flex;flex-wrap:wrap;gap:10px 20px}.command{margin-bottom:12px}.command code{white-space:pre-wrap}.unavailable{border:1px solid var(--blue);padding:20px}
@media(max-width:600px){main{padding:20px 18px 36px}.hero{padding-top:30px}.steps{gap:8px;font-size:11px}.steps button{padding:7px 8px}.panel{padding:20px}.details,.technical .tech-grid{grid-template-columns:1fr;gap:20px}.observation{min-height:156px}.controls button{padding:9px 12px;font-size:14px}}
