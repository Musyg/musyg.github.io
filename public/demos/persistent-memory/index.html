          node.querySelector("strong").textContent = words[names[index]];
          node.querySelector("span").textContent = words[state];
          node.setAttribute("aria-label", `${words.inspected} ${words[names[index]]}: ${words[state]}`);
        });
        const brief = currentEvidence(event, "atlas-brief").node;
        [["edge-date", "atlas-deadline"], ["edge-language", "atlas-language"]].forEach(([id, artifact]) => {
          const source = currentEvidence(event, artifact).ref;
          byId(id).dataset.linked = String(Boolean(source && brief?.dependencies?.some((dependency) => dependency.relation === "derives" && sameRef(dependency.ref, source))));
        });
        const transitions = [[words.initial, words.friday], [words.linked, words.derived], [words.oldFriday, words.corrected], [words.beforeWithdrawal, words.withdrawn], [words.oldBackup, words.verifiedRestore]];
        byId("change-before").textContent = transitions[position][0];
        byId("change-after").textContent = transitions[position][1];
        const control = currentEvidence(event, "atlas-language");
        byId("preserved-language").textContent = (control.read || control.node)?.allowed ? (position === 0 ? words.registeredLanguage : words.preserved) : humanReason(control.read || control.node, words);
        byId("restore-authority").hidden = event.phase !== "restore";
        byId("restore-authority").textContent = event.details.retained_current_authority === true ? words.authority : "";
        renderInspector(event, words);
      }
      function updateUrl(replace = false) {
        const url = new URL(location.href);
        url.searchParams.set("lang", language);
        url.searchParams.set("step", String(position + 1));
        history[replace ? "replaceState" : "pushState"](null, "", url.href);
      }
      function navigate() {
        byId("share-link").hidden = true;
        byId("share-status").textContent = "";
        updateUrl();
        render();
      }
      nodeIds.forEach((id, index) => byId(id).addEventListener("click", () => {
        selectedArtifact = artifactIds[index];
        byId("technical").open = true;
        render();
        byId("technical").scrollIntoView({ block: "nearest" });
      }));
      byId("previous").addEventListener("click", () => { position = Math.max(0, position - 1); navigate(); });
      byId("next").addEventListener("click", () => { position = Math.min(phases.length - 1, position + 1); navigate(); });
      byId("restart").addEventListener("click", () => { position = 0; navigate(); });
      byId("language").addEventListener("click", () => { language = language === "fr" ? "en" : "fr"; navigate(); });
      byId("share").addEventListener("click", async () => {
        const words = copy[language];
        const url = new URL(location.href);
        url.searchParams.set("lang", language); url.searchParams.set("step", String(position + 1));
        // Manual copy is always available; never request clipboard permissions.
        const fallback = () => { byId("share-link").value = url.href; byId("share-link").hidden = false; byId("share-status").textContent = words.manualCopy; byId("share-link").focus(); byId("share-link").select(); };
        try {
          if (!navigator.clipboard?.writeText) { fallback(); return; }
          await navigator.clipboard.writeText(url.href);
          byId("share-link").hidden = true; byId("share-status").textContent = words.copied;
        } catch { fallback(); }
      });
      addEventListener("popstate", () => { language = new URLSearchParams(location.search).get("lang") === "en" ? "en" : "fr"; position = readPosition(); byId("share-link").hidden = true; byId("share-status").textContent = ""; render(); });
      render();
    </script>
  </body>
</html>
