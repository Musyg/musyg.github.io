        byId("guide").href = safeLink(trace.provenance.guide_url, pinnedBase ? `${pinnedBase}/docs/PORTFOLIO-DEMO.md` : "https://github.com/Musyg/persistent-memory");
        byId("command").textContent = "mkdir demo-output\npython examples/portfolio_demo.py --directory demo-output/state --output demo-output/trace.json";
        byId("provenance").textContent = `${words.recordedAt} ${trace.generated_at_utc} · ${trace.provenance.package} ${trace.provenance.installed_version}\n${words.sourceHash}: ${trace.provenance.script_sha256}`;
      }
      byId("previous").addEventListener("click", () => { position = Math.max(0, position - 1); render(); });
      byId("next").addEventListener("click", () => { position = Math.min(phases.length - 1, position + 1); render(); });
      byId("restart").addEventListener("click", () => { position = 0; render(); });
      byId("language").addEventListener("click", () => { language = language === "fr" ? "en" : "fr"; render(); });
      render();
    </script>
  </body>
</html>
